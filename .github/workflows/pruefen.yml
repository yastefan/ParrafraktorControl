# Prüft jeden PR und jeden Push auf main auf allen Plattformen (siehe docs/platforms.md).
# Linux ARM steht für den Raspberry Pi: dort fiel das Stream-Deck-Paket schon einmal still weg,
# weil eine native Abhängigkeit eine neuere Node-Version verlangte.
name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vortrag:
    # The 40C3 talk (private repo Parrafraktor-Vortrag) imports Engine, PARAMETER_VORGABE, auswahl …
    # from packages/engine and Vorschau, setzeVorschauStil from client/src/vorschau.ts straight from
    # the source. Typecheck and build it against this version, so a rename never breaks it unnoticed.
    # Needs the secret VORTRAG_TOKEN (fine-grained token, read-only "Contents" on Parrafraktor-Vortrag);
    # without it (e.g. PRs from forks) the job only warns.
    name: Talk (Parrafraktor-Vortrag) against this version
    runs-on: ubuntu-24.04
    steps:
      - name: Token present?
        id: token
        env:
          TOKEN: ${{ secrets.VORTRAG_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::Secret VORTRAG_TOKEN missing – interface to the talk not checked"; fi
      - if: steps.token.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          repository: yastefan/Parrafraktor-Vortrag
          token: ${{ secrets.VORTRAG_TOKEN }}
          path: vortrag
      # This version in place of the submodule (the talk's vite/tsconfig aliases point there)
      - if: steps.token.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          path: vortrag/parrafraktor
      - if: steps.token.outputs.ok == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vortrag/package-lock.json
      - if: steps.token.outputs.ok == '1'
        working-directory: vortrag
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vite build --outDir "$RUNNER_TEMP/vortrag-dist"

  pi:
    # Pi tools without a Pi: shellcheck and the dry run with fake nmcli/systemctl/raspi-config
    name: Pi scripts (shellcheck, dry run)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning -x -P SCRIPTDIR/.. pi/parrafraktor pi/*.sh pi/test/run.sh
      - run: pi/test/run.sh

  pruefen:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM (wie Pi), Node-Mindestversion
            os: ubuntu-24.04-arm
            node: "22.18.0"
          - name: Linux ARM (wie Pi), Node 24
            os: ubuntu-24.04-arm
            node: "24"
          - name: macOS, Node 24
            os: macos-latest
            node: "24"
          - name: Windows, Node 24
            os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Optionale Pakete lässt npm bei Fehlern still weg – hier wird es laut
      - name: Native Pakete fürs Stream Deck laden
        working-directory: server
        shell: bash
        run: |
          node -e '
            require("node-hid");
            require("@napi-rs/canvas");
            import("@elgato-stream-deck/node").then(
              () => console.log("Stream-Deck-Pakete geladen"),
              (e) => { console.error(e); process.exit(1); },
            );
          '
